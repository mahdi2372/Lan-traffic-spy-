name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest psutil cryptography
          npm install --no-audit --no-fund
      - name: Python tests
        run: python -m pytest tests/python -q
      - name: Frontend tests
        run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: PyInstaller
        run: pyinstaller --clean --noconfirm installer/lanwatcher.spec
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\LanWatcher.iss" /Qp'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LANWatcher-windows
          path: |
            dist/LANWatcher.exe
            installer/out/*.exe
