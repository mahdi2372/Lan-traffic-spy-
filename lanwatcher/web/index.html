<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>LAN Watcher</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1220' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2322d3ee'/%3E%3Cpath d='M16 6a10 10 0 0 1 10 10' stroke='%2322d3ee' stroke-width='2' fill='none'/%3E%3Cpath d='M16 2a14 14 0 0 1 14 14' stroke='%2334d399' stroke-width='2' fill='none' opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div id="app" class="layout">
    <aside class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="16" cy="16" r="3.5" fill="var(--accent)"/>
          <path d="M16 6a10 10 0 0 1 10 10" stroke="var(--accent)" stroke-width="2" fill="none"/>
          <path d="M16 2a14 14 0 0 1 14 14" stroke="var(--ok)" stroke-width="2" fill="none" opacity=".8"/>
        </svg>
        <div class="brand-text">LAN&nbsp;Watcher<span class="brand-sub">local network console</span></div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-page="dashboard" title="Live overview of the network"><span class="nav-ico">◫</span>Dashboard</a>
        <a href="#/devices" data-page="devices" title="Inventory of every discovered device"><span class="nav-ico">▤</span>Devices</a>
        <a href="#/map" data-page="map" title="Topology of router, APs and clients"><span class="nav-ico">⋔</span>Network Map</a>
        <a href="#/traffic" data-page="traffic" title="Bandwidth and flow metadata"><span class="nav-ico">≋</span>Traffic</a>
        <a href="#/router" data-page="router" title="Router / gateway information"><span class="nav-ico">⇄</span>Router</a>
        <a href="#/wifi" data-page="wifi" title="Wi-Fi adapters and visible networks"><span class="nav-ico">⌃</span>Wi-Fi</a>
        <a href="#/ethernet" data-page="ethernet" title="Wired adapter details"><span class="nav-ico">⧉</span>Ethernet</a>
        <a href="#/alerts" data-page="alerts" title="New device and change alerts"><span class="nav-ico">⚠</span>Alerts <span class="nav-badge" id="nav-alert-badge" hidden>0</span></a>
        <a href="#/history" data-page="history" title="Device and network timeline"><span class="nav-ico">◷</span>History</a>
        <a href="#/reports" data-page="reports" title="Export HTML / JSON / CSV / PDF reports"><span class="nav-ico">⇩</span>Reports</a>
        <a href="#/settings" data-page="settings" title="Configuration, privacy and diagnostics"><span class="nav-ico">⚙</span>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="local-only" title="LAN Watcher never sends telemetry. Everything stays on this machine.">
          <span class="dot ok"></span> Local-only · no telemetry
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div class="search-wrap">
          <input id="global-search" type="search" placeholder="Search IP, MAC, hostname, vendor, name…  (Ctrl+K)"
                 aria-label="Global search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-results">
          <div id="search-results" class="search-results" role="listbox" hidden></div>
        </div>
        <div class="top-actions">
          <span id="health-pill" class="pill neutral" title="Overall network health">health: —</span>
          <button id="btn-scan" class="btn" title="Run a discovery scan immediately">⟳ Scan now</button>
          <button id="btn-theme" class="btn ghost" title="Toggle dark / light mode" aria-label="Toggle theme">◐</button>
        </div>
      </header>

      <main id="content" class="content" tabindex="-1"></main>

      <footer class="statusbar">
        <span id="sb-status">connecting…</span>
        <span id="sb-scan"></span>
        <span id="sb-bw"></span>
        <span class="spacer"></span>
        <span id="sb-version"></span>
      </footer>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
